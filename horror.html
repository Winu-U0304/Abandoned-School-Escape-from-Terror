<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>廃病院〜恐怖からの脱出〜</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --fg: #c8c0b4;
      --heading: #d7d0c2;
      --link: #d8cfc0;
      --font-serif: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-family: var(--font-serif);
      background: var(--bg);
      color: var(--fg);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    main { max-width: 36rem; }
    h1 { color: var(--heading); font-size: clamp(1.5rem, 5vw, 2.4rem); font-weight: 400; letter-spacing: .18em; }
    p { line-height: 1.9; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>廃病院</h1>
    <p>脱出編を読み込んでいます…</p>
    <p>自動で移動しない場合は<a href="./廃病院～友達の救出～.html?mode=escape">こちらから開始</a>してください。</p>
  </main>
  <script>
    location.replace('./廃病院～友達の救出～.html?mode=escape');
  </script>
</body>
</html>
